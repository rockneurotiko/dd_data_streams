name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.elixir }}/${{ matrix.otp }})
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum the project supports.
          - elixir: "1.17"
            otp: "27"

          - elixir: "1.18"
            otp: "27"

          - elixir: "1.19"
            otp: "28"

          # What .tool-versions pins, and where lint and coverage run once.
          - elixir: "1.20"
            otp: "29"
            lint: lint
            coverage: coverage
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix do deps.get --check-locked, deps.compile
        if: steps.cache-deps.outputs.cache-hit != 'true'

      # The default suite is the protocol core: offline, no broker, no agent.
      - run: mix format --check-formatted
        if: matrix.lint

      - run: mix deps.unlock --check-unused
        if: matrix.lint

      - run: mix compile --warnings-as-errors
        if: matrix.lint

      - run: mix credo --strict
        if: matrix.lint

      # Fails below the threshold in mix.exs, so the offline suite cannot lose
      # ground unnoticed.
      - run: mix test --cover
        if: matrix.coverage

      - run: mix test
        if: ${{ !matrix.coverage }}

  broker:
    name: broker tier (${{ matrix.broker }})
    needs: test
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        # One container and one tier per leg, so the wall clock is the slowest
        # broker and not the sum of all of them.
        broker: [sqs, kafka, rabbitmq]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-1.20-29-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-1.20-29-

      - run: mix do deps.get --check-locked, deps.compile
        if: steps.cache-deps.outputs.cache-hit != 'true'

      # The tier's own container, healthy before the test starts: the same
      # `compose.yaml` and the same name a contributor uses with `just`.
      - run: docker compose up -d --wait --wait-timeout 180 ${{ matrix.broker }}

      # A real pipeline on the real client: the extractor's metadata shape, the
      # carrier round trip through the broker, and the tags are all asserted.
      - run: mix test --only ${{ matrix.broker }}

      - name: Broker logs
        if: failure()
        run: docker compose logs ${{ matrix.broker }}

  emulator:
    name: broker tier (Pub/Sub emulator)
    needs: test
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      PUBSUB_EMULATOR_HOST: 127.0.0.1:8085
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-1.20-29-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-1.20-29-

      - run: mix do deps.get --check-locked, deps.compile
        if: steps.cache-deps.outputs.cache-hit != 'true'

      # The reference decoder is dd-trace-py's msgpack and ddsketch readers: it
      # is what turns "the bytes were sent" into "the payload parses".
      - uses: actions/cache@v5
        id: cache-decoder
        with:
          path: e2e/decoder/.venv
          key: decoder-${{ hashFiles('e2e/decoder/requirements.txt') }}

      - name: Install the reference decoder
        if: steps.cache-decoder.outputs.cache-hit != 'true'
        run: |
          python3 -m venv e2e/decoder/.venv
          e2e/decoder/.venv/bin/pip install -r e2e/decoder/requirements.txt

      - name: Start the Pub/Sub emulator
        run: |
          docker run -d --name pubsub-emulator -p 127.0.0.1:8085:8085 \
            gcr.io/google.com/cloudsdktool/cloud-sdk:582.0.0-emulators \
            gcloud beta emulators pubsub start --project=dsm-test --host-port=0.0.0.0:8085
          for _ in $(seq 1 60); do
            curl -sf -X PUT -H 'content-type: application/json' -d '{}' \
              "http://$PUBSUB_EMULATOR_HOST/v1/projects/dsm-test/topics/ready" && exit 0
            sleep 1
          done
          echo "the emulator never became ready" >&2
          docker logs pubsub-emulator
          exit 1

      - run: mix test --only emulator
        env:
          DSM_PAYLOAD_DECODER: ${{ github.workspace }}/e2e/decoder/decode

      - name: Emulator logs
        if: failure()
        run: docker logs pubsub-emulator

  e2e:
    name: pipeline tier (Broadway + Pub/Sub)
    needs: test
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      PUBSUB_EMULATOR_HOST: 127.0.0.1:8085
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            deps
            _build
            e2e/deps
            e2e/_build
          key: e2e-${{ runner.os }}-1.20-29-${{ hashFiles('mix.lock', 'e2e/mix.lock') }}
          restore-keys: |
            e2e-${{ runner.os }}-1.20-29-

      - name: Start the Pub/Sub emulator
        run: |
          docker run -d --name pubsub-emulator -p 127.0.0.1:8085:8085 \
            gcr.io/google.com/cloudsdktool/cloud-sdk:582.0.0-emulators \
            gcloud beta emulators pubsub start --project=dsm-test --host-port=0.0.0.0:8085
          for _ in $(seq 1 60); do
            curl -sf -X PUT -H 'content-type: application/json' -d '{}' \
              "http://$PUBSUB_EMULATOR_HOST/v1/projects/dsm-test/topics/ready" && exit 0
            sleep 1
          done
          echo "the emulator never became ready" >&2
          docker logs pubsub-emulator
          exit 1

      - uses: actions/cache@v5
        id: cache-decoder
        with:
          path: e2e/decoder/.venv
          key: decoder-${{ hashFiles('e2e/decoder/requirements.txt') }}

      - name: Install the reference decoder
        if: steps.cache-decoder.outputs.cache-hit != 'true'
        run: |
          python3 -m venv e2e/decoder/.venv
          e2e/decoder/.venv/bin/pip install -r e2e/decoder/requirements.txt

      - run: mix do deps.get --check-locked, deps.compile
        if: steps.cache-deps.outputs.cache-hit != 'true'

      # A real Broadway pipeline on the client's pull producer. The script
      # verifies the pathway chain, the injected attributes and the decoded
      # payload, and exits non-zero when any of it is missing.
      - name: Run the end-to-end pipeline
        working-directory: e2e
        run: |
          mix deps.get --check-locked
          mix run --no-start run.exs

      - name: Captured payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-captures
          path: e2e/capture-*/*.bin
          if-no-files-found: warn

      - name: Emulator logs
        if: failure()
        run: docker logs pubsub-emulator

  agent:
    name: agent tier (transport)
    needs: test
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      DD_TRACE_AGENT_URL: http://127.0.0.1:8126
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-1.20-29-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-1.20-29-

      - run: mix do deps.get --check-locked, deps.compile
        if: steps.cache-deps.outputs.cache-hit != 'true'

      # A stub, not an agent: it answers 202 to anything. This tier proves the
      # request reaches the configured URL over a socket and that a 2xx is
      # handled, not that Datadog accepts the payload. Posting through a real
      # agent with an API key is a manual check (see e2e/README.md), because it
      # needs a secret and sends data to a real account.
      - run: |
          elixir e2e/stub_agent.exs &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8126/ && break
            sleep 1
          done
          mix test --only agent

